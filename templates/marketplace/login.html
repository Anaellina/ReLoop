<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ReLoop</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<header class="navbar">
    <a href="/" class="logo">⟳ ReLoop<span>.</span></a>
    <a href="/">Back to Home</a>
</header>

<section class="auth-section">
    <div class="auth-card">
        <span class="eyebrow">WELCOME BACK ♡</span>
        <h1>Log in to ReLoop</h1>
        <p>Your next great find is waiting for you.</p>

        {% if form.errors %}
            <p style="color:#C94F8A;">
                Your username or password is incorrect. Please try again.
            </p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label for="id_username">Username</label>
            <input type="text" name="username" id="id_username"
                   autocomplete="username" required>

            <label for="id_password">Password</label>
            <input type="password" name="password" id="id_password"
                   autocomplete="current-password" required>

            <button type="submit" class="primary-btn"
                    style="width:100%; margin-top:22px; border:0; cursor:pointer;">
                Login →
            </button>
        </form>

        <div class="auth-link">
            New to ReLoop?
            <a href="/register/">Create an account</a>
        </div>
    </div>
</section>

</body>
</html>
